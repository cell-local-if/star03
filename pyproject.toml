[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-content-provenance"
version = "0.0.0"
description = "Backend for a digital content provenance evidence network"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
